x-guardian: &guardian
  build: ./backend
  environment:
    GUARDIAN_DATABASE_URL: postgresql://guardian:${POSTGRES_PASSWORD:?Set a database password}@db:5432/guardian
    GUARDIAN_HISTORY_KEY: ${GUARDIAN_HISTORY_KEY:?Set a history encryption key}
    GUARDIAN_ENROLLMENT_SECRET: ${GUARDIAN_ENROLLMENT_SECRET:?Set an enrollment secret}
    GUARDIAN_RETENTION_DAYS: ${GUARDIAN_RETENTION_DAYS:-7}
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: guardian
      POSTGRES_USER: guardian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a database password}
    volumes:
      - guardian-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U guardian -d guardian]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    <<: *guardian
    command: [python, -m, guardian.migrate, migrate]
    depends_on:
      db:
        condition: service_healthy
  api:
    <<: *guardian
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://localhost:8000/readyz', timeout=2).close()"]
      interval: 10s
      timeout: 4s
      retries: 5
  retention:
    <<: *guardian
    command: [sh, -ec, 'while true; do python -m guardian.migrate purge; sleep 3600; done']
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  guardian-data:
