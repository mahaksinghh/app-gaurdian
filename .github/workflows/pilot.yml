name: AppGuardian pilot end to end
on:
  pull_request:
permissions:
  contents: read
jobs:
  android-to-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POSTGRES_PASSWORD: guardian_android_ci_only
      GUARDIAN_HISTORY_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      GUARDIAN_ENROLLMENT_SECRET: guardian-android-ci-enrollment-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: docker compose up --build --wait
      - run: bash ci/pilot-https.sh
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash ci/pilot-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot-android-results
          path: |
            app/build/outputs/androidTest-results/
            app/build/pilot-preview/
          if-no-files-found: warn
      - if: always()
        run: |
          docker compose logs --no-color
          docker rm -f guardian-pilot-https || true
          docker compose down -v
