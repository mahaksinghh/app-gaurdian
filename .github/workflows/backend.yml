name: Backend tests
on:
  pull_request:
  push:
    branches: [main, 'codex/backend-foundation']
permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: guardian_ci_only
          POSTGRES_USER: guardian
          POSTGRES_DB: guardian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guardian -d guardian"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-test.txt
      - run: python -m pytest -q
        working-directory: backend
        env:
          GUARDIAN_TEST_DATABASE_URL: postgresql://guardian:guardian_ci_only@localhost:5432/guardian
