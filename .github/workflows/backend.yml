name: Backend tests
on:
  pull_request:
  push:
    branches: [main, 'codex/backend-foundation']
permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: guardian_ci_only
          POSTGRES_USER: guardian
          POSTGRES_DB: guardian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guardian -d guardian"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-test.txt
      - run: python -m pytest -q
        working-directory: backend
        env:
          GUARDIAN_TEST_DATABASE_URL: postgresql://guardian:guardian_ci_only@localhost:5432/guardian

  isolated-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_PASSWORD: guardian_worker_ci_only
      GUARDIAN_HISTORY_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      GUARDIAN_ENROLLMENT_SECRET: guardian-ci-enrollment-secret-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - run: docker compose --profile intelligence run --rm --build catalog
      - run: docker compose up --build --wait
      - run: bash backend/ci/worker-smoke.sh
      - if: always()
        run: docker compose logs --no-color && docker compose down -v
